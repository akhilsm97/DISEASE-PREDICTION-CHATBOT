<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Disease Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: rgb(227, 223, 223);
            font-family: 'Segoe UI', sans-serif;
        }
        .chat-container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .chat-header {
            background-color: black;
            color: #fff;
            padding: 15px;
            font-size: 18px;
        }
        .chat-box {
            display: flex;
            flex-direction: column;
            height: 500px;
            overflow-y: auto;
            padding: 15px;
            background-color: white;
        }
        .message-row {
            display: flex;
            margin-bottom: 10px;
        }
        .message-row.user {
            justify-content: flex-end;
        }
        .message-row.bot {
            justify-content: flex-start;
        }
        .chat-message {
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 50px;
            word-wrap: break-word;
            font-size: 15px;
            position: relative;
        }
        .chat-message.user {
            background-color: #e84144;
            color: white;
            margin-right: 10px;
        }
        .chat-message.bot {
            background-color: #34b7f1;
            color: #f8f6f6;
            margin-left: 10px;
        }
        .chat-message.user::after {
            content: "";
            position: absolute;
            top: 50%;
            right: -10px;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 15px solid #e84144;
        }
        .chat-message.bot::after {
            content: "";
            position: absolute;
            top: 50%;
            left: -10px;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-right: 15px solid #34b7f1;
        }
        .chat-footer {
            padding: 10px;
            background-color: #f0f0f0;
        }
        .chat-footer input {
            border-radius: 20px;
        }
        .avatar {
            width: 50px;
            height: 50px;
            margin-top: 5px;
        }

        /* 3 Dots Typing Indicator */
        .dot-typing {
            display: inline-block;
            position: relative;
            width: 40px;
            height: 20px;
            margin-top: 30px;
            margin-left: 5px;
        }
        .dot-typing span {
            position: absolute;
            top: 0;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34b7f1;
            animation: blink 1.4s infinite both;
        }
        .dot-typing span:nth-child(1) {
            left: 0px;
            animation-delay: 0s;
        }
        .dot-typing span:nth-child(2) {
            left: 12px;
            animation-delay: 0.2s;
        }
        .dot-typing span:nth-child(3) {
            left: 24px;
            animation-delay: 0.4s;
        }
        @keyframes blink {
            0%, 80%, 100% {
                opacity: 0;
            }
            40% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card shadow" style="max-width: 600px; margin: auto;">
        <div class="card-header bg-dark text-white">🩺 HealthBot</div>
        <div class="card-body chat-box" id="chat-box"></div>
        <div class="card-footer">
            <form id="chat-form" class="d-flex">
                <input type="text" id="message-input" class="form-control doc" placeholder="Type a message..." required>
                <button type="submit" class="btn btn-success ms-2">Send</button>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
    sendMessage("hi");
    });

    function sendMessage(message) {
        const chatBox = document.getElementById("chat-box");
        if (message.trim() === "") return;

        // If the message is to clear chat, clear the chat box and reset session
        if (message.trim().toLowerCase() === "clear chat" || message.trim().toLowerCase() === "reset chat") {
            chatBox.innerHTML = "";  // Clear all chat messages from the box
            document.getElementById("message-input").value = "";  // Reset the input field
            fetch("{% url 'get_next_question' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                    "Content-Type": "application/x-www-form-urlencoded",
                },
                body: `message=${encodeURIComponent("clear chat")}`,
            })
            .then(response => response.json())
            .then(data => {
                // Show confirmation from bot that chat is cleared
                chatBox.innerHTML = `<div class="message-row bot">
                                        <img src="{% static 'chatbot/img/face1.jpg' %}" class="avatar rounded-5" alt="avatar">
                                        <div class="chat-message bot">${data.response}</div>
                                    </div>`;
                chatBox.scrollTop = chatBox.scrollHeight;  // Scroll to the bottom
            });
            return;
        }

        // Show user message
        chatBox.innerHTML += `
            <div class="message-row user">
                <div class="chat-message user" style="margin-left:10px;">${message}</div>
                <img src="{% static 'chatbot/img/face1.jpg' %}" class="avatar rounded-5" alt="avatar">
            </div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        // Typing indicator (3 dots only)
        const typingId = `typing-${Date.now()}`;
        chatBox.innerHTML += `
            <div class="message-row bot" id="${typingId}">
                <img src="{% static 'chatbot/img/face1.jpg' %}" class="avatar rounded-5" alt="avatar">
                <div class="dot-typing">
                    <span></span><span></span><span></span>
                </div>
            </div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        // Fetch bot response
        fetch("{% url 'get_next_question' %}", {
            method: "POST",
            headers: {
                "X-CSRFToken": "{{ csrf_token }}",
                "Content-Type": "application/x-www-form-urlencoded",
            },
            body: `message=${encodeURIComponent(message)}`,
        })
        .then(response => response.json())
        .then(data => {
            // Replace typing indicator with actual response
            setTimeout(() => {
                const typingDiv = document.getElementById(typingId);
                if (typingDiv) {
                    typingDiv.innerHTML = `
                        <img src="{% static 'chatbot/img/face1.jpg' %}" class="avatar rounded-5" alt="avatar">
                        <div class="chat-message bot">${data.response}</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            }, 3000);
        });
    }

    document.getElementById("chat-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const input = document.getElementById("message-input");
        const msg = input.value;
        sendMessage(msg);
        input.value = "";
    });


</script>

</body>
</html>
